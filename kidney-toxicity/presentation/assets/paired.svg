<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" font-family="Liberation Sans, DejaVu Sans, sans-serif">
  <defs><marker id="ah3" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#5A6B78"/></marker></defs>
  <!-- the one drug -->
  <rect x="40" y="150" width="220" height="100" rx="12" fill="#0E4D64"/>
  <text x="150" y="190" text-anchor="middle" font-size="20" font-weight="800" fill="#FFFFFF">drisapersen</text>
  <text x="150" y="216" text-anchor="middle" font-size="14" fill="#BFE0E8">one oligo, tested 3 ways</text>
  <line x1="262" y1="200" x2="320" y2="120" stroke="#5A6B78" stroke-width="3" marker-end="url(#ah3)"/>
  <line x1="262" y1="200" x2="320" y2="200" stroke="#5A6B78" stroke-width="3" marker-end="url(#ah3)"/>
  <line x1="262" y1="200" x2="320" y2="280" stroke="#5A6B78" stroke-width="3" marker-end="url(#ah3)"/>

  <!-- result chip 1: functional -->
  <rect x="330" y="64" width="420" height="92" rx="10" fill="#FBF3E7" stroke="#F2B705" stroke-width="2.5"/>
  <text x="350" y="98" font-size="16" font-weight="800" fill="#0E4D64">Functional readout (ciPTEC)</text>
  <text x="350" y="124" font-size="14.5" fill="#14202B">A1M protein leakage &#8593;</text>
  <rect x="650" y="86" width="80" height="48" rx="8" fill="#F2B705"/><text x="690" y="118" text-anchor="middle" font-size="22" font-weight="800" fill="#3A2E00">G1</text>
  <!-- result chip 2: viability -->
  <rect x="330" y="166" width="420" height="68" rx="10" fill="#EAF6EC" stroke="#2E7D32" stroke-width="2.5"/>
  <text x="350" y="196" font-size="16" font-weight="800" fill="#0E4D64">Viability readout</text>
  <text x="350" y="220" font-size="14.5" fill="#14202B">cells unchanged &#8212; no death</text>
  <rect x="650" y="178" width="80" height="44" rx="8" fill="#2E7D32"/><text x="690" y="208" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">G0</text>
  <!-- result chip 3: histopath -->
  <rect x="330" y="244" width="420" height="68" rx="10" fill="#EAF6EC" stroke="#2E7D32" stroke-width="2.5"/>
  <text x="350" y="274" font-size="16" font-weight="800" fill="#0E4D64">Monkey histopathology</text>
  <text x="350" y="298" font-size="14.5" fill="#14202B">tissue looks normal</text>
  <rect x="650" y="256" width="80" height="44" rx="8" fill="#2E7D32"/><text x="690" y="286" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">G0</text>

  <!-- synthesis -->
  <line x1="752" y1="188" x2="804" y2="188" stroke="#5A6B78" stroke-width="3" marker-end="url(#ah3)"/>
  <rect x="812" y="120" width="252" height="140" rx="12" fill="#0E4D64"/>
  <text x="938" y="160" text-anchor="middle" font-size="17" font-weight="800" fill="#FFFFFF">Dysfunction</text>
  <text x="938" y="186" text-anchor="middle" font-size="17" font-weight="800" fill="#FFFFFF">without death</text>
  <text x="938" y="220" text-anchor="middle" font-size="13.5" fill="#BFE0E8">the signal viability-only</text>
  <text x="938" y="238" text-anchor="middle" font-size="13.5" fill="#BFE0E8">datasets cannot teach</text>
</svg>
