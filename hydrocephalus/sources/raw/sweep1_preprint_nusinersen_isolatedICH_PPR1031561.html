tw-border-gray-100 tw-bg-white tw-rounded-lg lg:tw-hidden tw-max-w-xl lg:tw-max-w-none tw-mt-3 tw-mb-0"><div class="tw-px-4"><button type="button" class="tw-min-w-full focus:tw-outline-none tw-group"><div class="tw-flex tw-items-center tw-justify-between"><div class="tw-w-full tw-py-2"><div class="tw-flex tw-items-center"><h3 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-base">Status:</h3><div class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700 tw-ml-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-color-gray-800">Posted</p></div></div></div><div class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700 tw-my-2 tw-flex tw-items-center tw-duration-300 tw-transform tw-bg-gray-100 group-hover:tw-bg-gray-200"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black tw-text-gray-800 group-hover:tw-text-gray-900 tw-flex"></p><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-text-gray-800 group-hover:tw-text-gray-900 tw-h-6 tw-w-6 tw-flex-shrink-0 tw-rounded-full tw-transform tw-duration-300"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-px-4 tw-border-t-2 tw-border-gray-100"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><div class="tw-py-2"><div class="tw-text-left"><h3 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-base">Version <!-- -->1</h3><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black tw-text-gray-700">posted<!-- --> </p></div></div></div><div class="tw-pt-1"><div class="tw-pb-1"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700 tw-flex tw-justify-center tw-w-full tw-mb-2">You are reading this <!-- -->latest<!-- --> <!-- -->preprint<!-- --> version</span></p></div></div></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">Abstract</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><p>In patients with spinal muscular atrophy (SMA) headache and vomiting after intrathecal administration of nusinersen is usually attributed to post-lumbar puncture syndrome. Additional adverse effects include idiopathic intracranial hypertension and hydrocephalus, with symptomatic intracranial hypertension also reported in adults. We describe a child with SMA type 2 who developed elevated lumbar puncture opening pressure (LOP) after the 12th injection of nusinersen, persisting at the 14th injection, without symptoms of increased LOP. Evaluations, including brain MRI, MRA, visual acuity, intraocular pressure, fundoscopy, revealed no abnormalities. This case suggests the possibility of isolated intracranial hypertension as a complication of repeated nusinersen therapy. Routine LOP monitoring is advised for long-term recipients to detect early complications.</p></div></span></div><div class="tw-flex tw-flex-wrap tw-pb-3"><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">Spinal muscular atrophy</span></p></div><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">nusinersen</span></p></div><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">isolated intracranial hypertension</span></p></div></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">Background</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><p>Spinal muscular atrophy (SMA) is an autosomal recessive neuromuscular disease caused by insufficient levels of survival motor neuron (SMN) protein[<span citationid="CR1" class="CitationRef">1</span>, <span citationid="CR2" class="CitationRef">2</span>]. This deficiency leads to the loss of anterior horn motor neurons in the spinal cord, affecting the motor neurons within, resulting in progressive muscle atrophy and weakness[<span citationid="CR1" class="CitationRef">1</span>, <span citationid="CR3" class="CitationRef">3</span>]. Nusinersen, the first antisense oligonucleotide used to treat SMA, is administered intrathecally and enhances the inclusion of exon 7 in SMN2, thereby elevating SMN protein levels[<span citationid="CR4" class="CitationRef">4</span>, <span citationid="CR5" class="CitationRef">5</span>]. As nusinersen does not penetrate the blood-brain barrier, it requires intrathecal administration. The most prevalent side effects of nusinersen treatment, including headache and vomiting, are primarily associated with post-lumbar puncture syndrome<sup>[6]</sup>.</p> <p>Repeated nusinersen administration may increase intracranial pressure. Zhuang et al reported 5,324 nusinersen-treated cases, 196 adverse events (AEs) were documented, including 4 idiopathic intracranial hypertension cases with limited clinical details<sup>[7]</sup>. Rare AEs such as hydrocephalus, elevated lumbar puncture opening pressure (LOP), and papilledema have been observed in both pediatric and adult patients[<span citationid="CR8" class="CitationRef">8</span>, <span citationid="CR9" class="CitationRef">9</span>]. A study of patients aged 0.7 to 20 years receiving intrathecal nusinersen found 35.3% had LOP&thinsp;&gt;&thinsp;28 cmH<sub>2</sub>O (normal range: 10&ndash;25 cmH<sub>2</sub>O), with a maximum of 50 cmH<sub>2</sub>O. Only one patient reported transient headache. Two asymptomatic patients exhibited elevated LOP prior to treatment initiation. Data were limited to the first 10 injections, and intracranial pressure monitoring was inconsistent<sup>[10]</sup>.</p> <p>We report a case of a pediatric patient with SMA who developed isolated intracranial hypertension after 11 doses of nusinersen treatment, yet exhibited no clinical manifestations of elevated intracranial pressure.</p></div></span></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">Case presentation</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><p>The 10-year-old male first showed symptoms of delayed motor development at an age of 6 months. He was able to sit without support but soon lost the ability. He was never able to stand or walk unassisted. At the age of 11 months the diagnosis of 5q-associated SMA was genetically confirmed. The patient has a homozygous deletion of exons 7 and 8 of the SMN1 gene and 3 copies of the SMN2 gene. Following alternating inpatient and home-based physical rehabilitation, the patient initially exhibited halted motor function regression with gradual improvement, achieving assisted standing as the highest motor milestone. However, due to the absence of disease-modifying therapies and inconsistent rehabilitation adherence, progressive motor decline emerged with age, predominantly affecting lower extremities.</p> <p>During the initial evaluation at Xiangya Hospital in January 2022, the patient demonstrated independent sitting capacity, preserved writing ability, laborious rolling maneuvers, electric wheelchair mobility via joystick control, and loss of assisted standing/ambulation, alongside documented scoliosis and bilateral knee/ankle contractures. From January 2022 to May 2024, the patient received 11 intrathecal nusinersen doses without sedation. The first 7 doses yielded mild upper limb/trunk strength enhancement, improved handwriting fluency, independent rolling capacity, and score increases of 9 points on both the Hammersmith Functional Motor Scale Expanded and Revised Upper Limb Module. Subsequent doses 8&ndash;11 coincided with a 5 kg weight gain exacerbating rolling difficulty and recurrent pneumonia episodes necessitating rehabilitation discontinuation, culminating in gradual functional deterioration. The LOP was measured at 100 mmH<sub>2</sub>O during the initial treatment. Throughout the first 11 treatment sessions, LOP fluctuated between 100&ndash;150 mmH<sub>2</sub>O.</p> <p>At the 12th dose, LOP was measured at 255 mmH<sub>2</sub>O (normal range 40&thinsp;~&thinsp;180 mmH<sub>2</sub>O), despite the absence of characteristic symptoms such as headache, visual disturbances, or vomiting, and normal cerebrospinal fluid parameters including cell count, protein, and glucose levels, the guardians declined further diagnostic investigations to elucidate the etiology of high LOP. At the 13th dose, LOP escalated to 290 mmH<sub>2</sub>O, prompting mannitol administration despite persistent guardian refusal of diagnostic investigations. During the hospitalization for the 14th intrathecal nusinersen administration, a series of mandated neuro-ophthalmological evaluations encompassing brain MRI, MRA, fundoscopic examination, intraocular pressure measurement, and visual acuity testing were conducted, all demonstrating normal results. However, the LOP remained persistently elevated at 250 mmH<sub>2</sub>O. Cerebrospinal fluid analysis (5 mL collected) demonstrated acellular fluid (0 cells/L) with biochemical parameters within normal ranges: glucose 3.69 mmol/L, lactate dehydrogenase 14.0 U/L, and protein 0.21 g/L. Given the patient's persistent intracranial hypertension lasting 8 months without any clinical symptoms, close observation with regular LOP monitoring was recommended, and pharmacological intervention was withheld at this stage.</p></div></span></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">Discussion</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><p>Our patient exhibited persistently elevated LOP without typical symptoms, meeting diagnostic criteria for isolated intracranial hypertension. Notably, this observation of asymptomatic LOP elevation in pediatric SMA patient undergoing nusinersen therapy may indicate a potential treatment-related phenomenon warranting further mechanistic investigation.</p> <p>In the cohort reported by Becker et al., 12 patients exhibited elevated LOP levels; however, these data do not sufficiently establish a causal link to nusinersen<sup>[10]</sup>. Two patients had pre-existing LOP elevation prior to nusinersen administration. Three patients had incomplete LOP documentation, limited to a single elevated measurement. Other patients demonstrated fluctuating LOP levels, with transient isolated elevations during serial monitoring or rapid normalization after elevation<sup>[10]</sup>. Repeated lumbar punctures rarely lead to increased intracranial pressure, and no secondary complications such as infection, hemorrhage, or sinus venous thrombosis were observed in this patient. The cohort study revealed an association between LOP and sedation levels<sup>[10]</sup>. But our patient did not receive sedatives throughout the course of treatment. Compared to adults, the inherent biological variability in children and the compensatory capacity of the ventricular system to accommodate small volumetric changes may predispose to elevated LOP. However, we routinely withdraw 5 mL of CSF prior to nusinersen administration to mitigate cerebrospinal fluid volume fluctuations. Notably, the patient exhibited elevated LOP preceding three consecutive nusinersen injections, with measurements taken at four-month intervals.</p> <p>Patients with SMA exhibit a significantly higher incidence of hydrocephalus than controls. Several case studies have documented hydrocephalus in SMA patients, primarily among those with severe phenotypes (type 0 and type 1)<sup>[11&ndash;13]</sup>. Surveillance bias may contribute to the observed increased risk, as SMA patients often undergo routine MRI scans that detect asymptomatic cases. This detection bias appears particularly relevant for adult patients, who frequently present with asymptomatic hydrocephalus<sup>[14]</sup>. Isolated cases of hydrocephalus during nusinersen treatment have been reported, though researchers have primarily attributed these events to the natural progression of SMA disease itself rather than drug-related adverse effects[<span citationid="CR8" class="CitationRef">8</span>, <span citationid="CR15" class="CitationRef">15</span>]. In our patient, despite markedly elevated LOP, no clinical or imaging evidence of hydrocephalus was observed. This patient showed no clinical signs of intracranial hypertension, and ongoing monitoring remains essential for early detection of potential complications. Should symptoms like blurred vision, vomiting, or headache emerge, or if lumbar opening pressure measurements remain elevated without improvement, risdiplam administration could serve as a viable therapeutic option.</p></div></span></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">Conclusion</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><p>The etiology of this patient's isolated intracranial hypertension remains unclear, though the clinical timeline implicates elevated intracranial pressure as a possible complication of nusinersen therapy. Measuring lumbar opening pressure before every intrathecal injection remains essential, including during long-term nusinersen treatment. Additionally, post-procedural headaches, whether persistent or intermittent, should not be automatically attributed to post-lumbar puncture syndrome without thorough clinical evaluation.</p></div></span></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">Abbreviations</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><div class="DefinitionList"> <div class="DefinitionListEntry"> <div class="Term"><b>SMA</b></div> <div class="Description"> <p>Spinal muscular atrophy</p> </div> </div> <div class="DefinitionListEntry"> <div class="Term"><b>AEs</b></div> <div class="Description"> <p>Adverse events</p> </div> </div> <div cla en Xu","email":"","orcid":"","institution":"Xiangya Hospital of Central South University","correspondingAuthor":false,"submittingAuthor":false,"prefix":"","firstName":"Yiwen","middleName":"","lastName":"Xu","suffix":""},{"id":465061661,"identity":"ee4d13bd-7b42-41a8-85ec-744825f53921","order_by":2,"name":"Jing Peng","email":"","orcid":"","institution":"Xiangya Hospital of Central South University","correspondingAuthor":false,"submittingAuthor":false,"prefix":"","firstName":"Jing","middleName":"","lastName":"Peng","suffix":""},{"id":465061664,"identity":"28f226f7-ce95-463f-bbff-5ae77ad68704","order_by":3,"name":"Haolin Duan","email":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAZAAAAAyAQMAAABI0h/eAAAABlBMVEX///8AAABVwtN+AAAACXBIWXMAAA7EAAAOxAGVKw4bAAAA6ElEQVRIie3QMaoCMRCA4SwDsRmwzSLuGRYCa7PoVTYIqTyApSBoI9aKHmKPMDKFjWCrnbBgZbFg/57R8vHIameRn1RhPjJEiFDoC2sDEBVjlbRbk9dFNGki8Vwaqg+5jhf0JkmPqHfrmTXlqXiTCJYFo2QtzlV1R5F3S4LrxSeiKRAjchJtbNZBYXVJspf6CMDzFcUaOiMJKNiUhFL5iBtL2R0ziw/gFvttJujIblVYs1Ao3GLUTJRbjGrKtUKbxdt0qNcsMy8ZHJlr86OSwZ6r+jbud5f76dVL/vT8KvhgPhQKhUL/9wAx/El3YRJiMgAAAABJRU5ErkJggg==","orcid":"","institution":"Xiangya Hospital of Central South University","correspondingAuthor":true,"submittingAuthor":false,"prefix":"","firstName":"Haolin","middleName":"","lastName":"Duan","suffix":""}],"badges":[],"createdAt":"2025-05-27 08:53:13","currentVersionCode":1,"declarations":"","doi":"10.21203/rs.3.rs-6757354/v1","doiUrl":"https://doi.org/10.21203/rs.3.rs-6757354/v1","draftVersion":[],"editorialEvents":[],"editorialNote":"","failedWorkflow":false,"files":[{"id":85968668,"identity":"ce5cc54d-06e6-4896-a2f3-eea0f51eb7b3","added_by":"auto","created_at":"2025-07-03 17:46:33","extension":"pdf","order_by":0,"title":"","display":"","copyAsset":false,"role":"manuscript-pdf","size":311458,"visible":true,"origin":"","legend":"","description":"","filename":"manuscript.pdf","url":"https://assets-eu.researchsquare.com/files/rs-6757354/v1/1ef1b642-d534-4257-b2da-e23f275d60d4.pdf"}],"financialInterests":"No competing interests reported.","formattedTitle":"Isolated intracranial hypertension developing in SMA receiving nusinersen: A case report","fulltext":[{"header":"Background","content":"\u003cp\u003eSpinal muscular atrophy (SMA) is an autosomal recessive neuromuscular disease caused by insufficient levels of survival motor neuron (SMN) protein[\u003cspan citationid=\"CR1\" class=\"CitationRef\"\u003e1\u003c/span\u003e, \u003cspan citationid=\"CR2\" class=\"CitationRef\"\u003e2\u003c/span\u003e]. This deficiency leads to the loss of anterior horn motor neurons in the spinal cord, affecting the motor neurons within, resulting in progressive muscle atrophy and weakness[\u003cspan citationid=\"CR1\" class=\"CitationRef\"\u003e1\u003c/span\u003e, \u003cspan citationid=\"CR3\" class=\"CitationRef\"\u003e3\u003c/span\u003e]. Nusinersen, the first antisense oligonucleotide used to treat SMA, is administered intrathecally and enhances the inclusion of exon 7 in SMN2, thereby elevating SMN protein levels[\u003cspan citationid=\"CR4\" class=\"CitationRef\"\u003e4\u003c/span\u003e, \u003cspan citationid=\"CR5\" class=\"CitationRef\"\u003e5\u003c/span\u003e]. As nusinersen does not penetrate the blood-brain barrier, it requires intrathecal administration. The most prevalent side effects of nusinersen treatment, including headache and vomiting, are primarily associated with post-lumbar puncture syndrome\u003csup\u003e[6]\u003c/sup\u003e.\u003c/p\u003e \u003cp\u003eRepeated nusinersen administration may increase intracranial pressure. Zhuang et al reported 5,324 nusinersen-treated cases, 196 adverse events (AEs) were documented, including 4 idiopathic intracranial hypertension cases with limited clinical details\u003csup\u003e[7]\u003c/sup\u003e. Rare AEs such as hydrocephalus, elevated lumbar puncture opening pressure (LOP), and papilledema have been observed in both pediatric and adult patients[\u003cspan citationid=\"CR8\" class=\"CitationRef\"\u003e8\u003c/span\u003e, \u003cspan citationid=\"CR9\" class=\"CitationRef\"\u003e9\u003c/span\u003e]. A study of patients aged 0.7 to 20 years receiving intrathecal nusinersen found 35.3% had LOP\u0026thinsp;\u0026gt;\u0026thinsp;28 cmH\u003csub\u003e2\u003c/sub\u003eO (normal range: 10\u0026ndash;25 cmH\u003csub\u003e2\u003c/sub\u003eO), with a maximum of 50 cmH\u003csub\u003e2\u003c/sub\u003eO. Only one patient reported transient headache. Two asymptomatic patients exhibited elevated LOP prior to treatment initiation. Data were limited to the first 10 injections, and intracranial pressure monitoring was inconsistent\u003csup\u003e[10]\u003c/sup\u003e.\u003c/p\u003e \u003cp\u003eWe report a case of a pediatric patient with SMA who developed isolated intracranial hypertension after 11 doses of nusinersen treatment, yet exhibited no clinical manifestations of elevated intracranial pressure.\u003c/p\u003e"},{"header":"Case presentation","content":"\u003cp\u003eThe 10-year-old male first showed symptoms of delayed motor development at an age of 6 months. He was able to sit without support but soon lost the ability. He was never able to stand or walk unassisted. At the age of 11 months the diagnosis of 5q-associated SMA was genetically confirmed. The patient has a homozygous deletion of exons 7 and 8 of the SMN1 gene and 3 copies of the SMN2 gene. Following alternating inpatient and home-based physical rehabilitation, the patient initially exhibited halted motor function regression with gradual improvement, achieving assisted standing as the highest motor milestone. However, due to the absence of disease-modifying therapies and inconsistent rehabilitation adherence, progressive motor decline emerged with age, predominantly affecting lower extremities.\u003c/p\u003e \u003cp\u003eDuring the initial evaluation at Xiangya Hospital in January 2022, the patient demonstrated independent sitting capacity, preserved writing ability, laborious rolling maneuvers, electric wheelchair mobility via joystick control, and loss of assisted standing/ambulation, alongside documented scoliosis and bilateral knee/ankle contractures. From January 2022 to May 2024, the patient received 11 intrathecal nusinersen doses without sedation. The first 7 doses yielded mild upper limb/trunk strength enhancement, improved handwriting fluency, independent rolling capacity, and score increases of 9 points on both the Hammersmith Functional Motor Scale Expanded and Revised Upper Limb Module. Subsequent doses 8\u0026ndash;11 coincided with a 5 kg weight gain exacerbating rolling difficulty and recurrent pneumonia episodes necessitating rehabilitation discontinuation, culminating in gradual functional deterioration. The LOP was measured at 100 mmH\u003csub\u003e2\u003c/sub\u003eO during the initial treatment. Throughout the first 11 treatment sessions, LOP fluctuated between 100\u0026ndash;150 mmH\u003csub\u003e2\u003c/sub\u003eO.\u003c/p\u003e \u003cp\u003eAt the 12th dose, LOP was measured at 255 mmH\u003csub\u003e2\u003c/sub\u003eO (normal range 40\u0026thinsp;~\u0026thinsp;180 mmH\u003csub\u003e2\u003c/sub\u003eO), despite the absence of characteristic symptoms such as headache, visual disturbances, or vomiting, and normal cerebrospinal fluid parameters including cell count, protein, and glucose levels, the guardians declined further diagnostic investigations to elucidate the etiology of high LOP. At the 13th dose, LOP escalated to 290 mmH\u003csub\u003e2\u003c/sub\u003eO, prompting mannitol administration despite persistent guardian refusal of diagnostic investigations. During the hospitalization for the 14th intrathecal nusinersen administration, a series of mandated neuro-ophthalmological evaluations encompassing brain MRI, MRA, fundoscopic examination, intraocular pressure measurement, and visual acuity testing were conducted, all demonstrating normal results. However, the LOP remained persistently elevated at 250 mmH\u003csub\u003e2\u003c/sub\u003eO. Cerebrospinal fluid analysis (5 mL collected) demonstrated acellular fluid (0 cells/L) with biochemical parameters within normal ranges: glucose 3.69 mmol/L, lactate dehydrogenase 14.0 U/L, and protein 0.21 g/L. Given the patient's persistent intracranial hypertension lasting 8 months without any clinical symptoms, close observation with regular LOP monitoring was recommended, and pharmacological intervention was withheld at this stage.\u003c/p\u003e"},{"header":"Discussion","content":"\u003cp\u003eOur patient exhibited persistently elevated LOP without typical symptoms, meeting diagnostic criteria for isolated intracranial hypertension. Notably, this observation of asymptomatic LOP elevation in pediatric SMA patient undergoing nusinersen therapy may indicate a potential treatment-related phenomenon warranting further mechanistic investigation.\u003c/p\u003e \u003cp\u003eIn the cohort reported by Becker et al., 12 patients exhibited elevated LOP levels; however, these data do not sufficiently establish a causal link to nusinersen\u003csup\u003e[10]\u003c/sup\u003e. Two patients had pre-existing LOP elevation prior to nusinersen administration. Three patients had incomplete LOP documentation, limited to a single elevated measurement. Other patients demonstrated fluctuating LOP levels, with transient isolated elevations during serial monitoring or rapid normalization after elevation\u003csup\u003e[10]\u003c/sup\u003e. Repeated lumbar punctures rarely lead to increased intracranial pressure, and no secondary complications such as infection, hemorrhage, or sinus venous thrombosis were observed in this patient. The cohort study revealed an association between LOP and sedation levels\u003csup\u003e[10]\u003c/sup\u003e. But our patient did not receive sedatives throughout the course of treatment. Compared to adults, the inherent biological variability in children and the compensatory capacity of the ventricular system to accommodate small volumetric changes may predispose to elevated LOP. However, we routinely withdraw 5 mL of CSF prior to nusinersen administration to mitigate cerebrospinal fluid volume fluctuations. Notably, the patient exhibited elevated LOP preceding three consecutive nusinersen injections, with measurements taken at four-month intervals.\u003c/p\u003e \u003cp\u003ePatients with SMA exhibit a significantly higher incidence of hydrocephalus than controls. Several case studies have documented hydrocephalus in SMA patients, primarily among those with severe phenotypes (type 0 and type 1)\u003csup\u003e[11\u0026ndash;13]\u003c/sup\u003e. Surveillance bias may contribute to the observed increased risk, as SMA patients often undergo routine MRI scans that detect asymptomatic cases. This detection bias appears particularly relevant for adult patients, who frequently present with asymptomatic hydrocephalus\u003csup\u003e[14]\u003c/sup\u003e. Isolated cases of hydrocephalus during nusinersen treatment have been reported, though researchers have primarily attributed these events to the natural progression of SMA disease itself rather than drug-related adverse effects[\u003cspan citationid=\"CR8\" class=\"CitationRef\"\u003e8\u003c/span\u003e, \u003cspan citationid=\"CR15\" class=\"CitationRef\"\u003e15\u003c/span\u003e]. In our patient, despite markedly elevated LOP, no clinical or imaging evidence of hydrocephalus was observed. This patient showed no clinical signs of intracranial hypertension, and ongoing monitoring remains essential for early detection of potential complications. Should symptoms like blurred vision, vomiting, or headache emerge, or if lumbar opening pressure measurements remain elevated without improvement, risdiplam administration could serve as a viable therapeutic option.\u003c/p\u003e"},{"header":"Conclusion","content":"\u003cp\u003eThe etiology of this patient's isolated intracranial hypertension remains unclear, though the clinical timeline implicates elevated intracranial pressure as a possible complication of nusinersen therapy. Measuring lumbar opening pressure before every intrathecal injection remains essential, including during long-term nusinersen treatment. Additionally, post-procedural headaches, whether persistent or intermittent, should not be automatically attributed to post-lumbar puncture syndrome without thorough clinical evaluation.\u003c/p\u003e"},{"header":"Abbreviations","content":"\u003cdiv class=\"DefinitionList\"\u003e \u003cdiv class=\"DefinitionListEntry\"\u003e \u003cdiv class=\"Term\"\u003e\u003cb\u003eSMA\u003c/b\u003e\u003c/div\u003e \u003cdiv class=\"Description\"\u003e \u003cp\u003eSpinal muscular atrophy\u003c/p\u003e \u003c/div\u003e \u003c/div\u003e \u003cdiv class=\"DefinitionListEntry\"\u003e \u003cdiv class=\"Term\"\u003e\u003cb\u003eAEs\u003c/b\u003e\u003c/div\u003e \u003cdiv class=\"Description\"\u003e \u003cp\u003eAdverse events\u003c/p\u003e \u003c/div\u003e \u003c/div\u003e \u003cdiv class=\"DefinitionListEntry\"\u003e \u003cdiv class=\"Term\"\u003e\u003cb\u003eLOP\u003c/b\u003e\u003c/div\u003e \u003cdiv class=\"Description\"\u003e \u003cp\u003eLumbar puncture opening pressure\u003c/p\u003e \u003c/div\u003e \u003c/div\u003e \u003cdiv class=\"DefinitionListEntry\"\u003e \u003cdiv class=\"Term\"\u003e\u003cb\u003eMRI\u003c/b\u003e\u003c/div\u003e \u003cdiv class=\"Description\"\u003e \u003cp\u003eMagnetic Resonance Imaging\u003c/p\u003e \u003c/div\u003e \u003c/div\u003e \u003cdiv class=\"DefinitionListEntry\"\u003e \u003cdiv class=\"Term\"\u003e\u003cb\u003eMRA\u003c/b\u003e\u003c/div\u003e \u003cdiv class=\"Description\"\u003e \u003cp\u003eMagnetic Resonance angiography\u003c/p\u003e \u003c/div\u003e \u003c/div\u003e \u003c/div\u003e"},{"header":"Declarations","content":"\u003cp\u003e\u003cstrong\u003eData availability\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eAll data are included in this study.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAuthors\u0026apos; contributions\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eZC and DH wrote the manuscript. XY collected clinical date. ZC, DH and PJ read and approved the final manuscript.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEthical Approval \u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eThis study received expedited ethical approval from the Ethics committee of Xiangya Hospital, Central South University. \u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eConsent to Participate \u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eWritten informed consent was obtained from both the patient and legal guardian, authorizing the use of clinical data for research purposes without influencing treatment decisions. \u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eConsent for Publication \u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eAll authors approved the manuscript for publication. The patient\u0026rsquo;s father provided written consent for publication and submitted supplementary materials.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eCompeting interests\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eAll authors have no conflict of interest to report.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eFunding and Acknowledgments\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eNot applicable.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eClinical trial number\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eNot applicable.\u003cbr\u003e\u0026nbsp;\u003c/p\u003e"},{"header":"References","content":"\u003col\u003e\n\u003cli\u003eLunn MR, Wang CH. Spinal muscular atrophy. Lancet. 2008;371:2120\u0026ndash;33.\u003c/li\u003e\n\u003cli\u003eLefebvre S, B\u0026uuml;rglen L, Reboullet S, Clermont O, Burlet P, Viollet L, et al. Identification and characterization of a spinal muscular atrophy-determining gene. Cell. 1995;80:155\u0026ndash;65.\u003c/li\u003e\n\u003cli\u003eDarras BT, Monani UR, De Vivo DC. Genetic Disorders Affecting the Motor Neuron. In: Swaiman\u0026rsquo;s Pediatric Neurology. Elsevier; 2017. p. 1057  of a new association and review of the literature. Surg Neurol Int. 2014; 5:282.\u003c/li\u003e\n\u003cli\u003eViscidi E, Wang N, Juneja M, Bhan I, Prada C, James D, et al. The incidence of hydrocephalus among patients with and without spinal muscular atrophy (SMA): Results from a US electronic health records study. Orphanet J Rare Dis. 2021;16.\u003c/li\u003e\n\u003cli\u003eSah JP, Abrams AW, Chari G, Linden C, Anziska Y. Hydrocephalus in Spinal Muscular Atrophy: A Case Report and Review of the Literature. J Pediatr Neurol. 2020; 19:352\u0026ndash;4.\u003c/li\u003e\n\u003c/ol\u003e"}],"fulltextSource":"","fullText":"","funders":[],"hasAdminPriorityOnWorkflow":false,"hasManuscriptDocX":true,"hasOptedInToPreprint":true,"hasPassedJournalQc":"","hasAnyPriority":false,"hideJournal":true,"highlight":"","institution":"","isAcceptedByJournal":false,"isAuthorSuppliedPdf":false,"isDeskRejected":"","isHiddenFromSearch":false,"isInQc":false,"isInWorkflow":false,"isPdf":false,"isPdfUpToDate":true,"isWithdrawnOrRetracted":false,"journal":{"display":true,"email":"info@researchsquare.com","identity":"researchsquare","isNatureJournal":false,"hasQc":true,"allowDirectSubmit":true,"externalIdentity":"","sideBox":"","snPcode":"","submissionUrl":"/submission","title":"Research Square","twitterHandle":"researchsquare","acdcEnabled":true,"dfaEnabled":false,"editorialSystem":"","reportingPortfolio":"","inReviewEnabled":false,"inReviewRevisionsEnabled":true},"keywords":"Spinal muscular atrophy, nusinersen, isolated intracranial hypertension","lastPublishedDoi":"10.21203/rs.3.rs-6757354/v1","lastPublishedDoiUrl":"https://doi.org/10.21203/rs.3.rs-6757354/v1","license":{"name":"CC BY 4.0","url":"https://creativecommons.org/licenses/by/4.0/"},"manuscriptAbstract":"\u003cp\u003eIn patients with spinal muscular atrophy (SMA) headache and vomiting after intrathecal administration of nusinersen is usually attributed to post-lumbar puncture syndrome. Additional adverse effects include idiopathic intracranial hypertension and hydrocephalus, with symptomatic intracranial hypertension also reported in adults. We describe a child with SMA type 2 who developed elevated lumbar puncture opening pressure (LOP) after the 12th injection of nusinersen, persisting at the 14th injection, without symptoms of increased LOP. Evaluations, including brain MRI, MRA, visual acuity, intraocular pressure, fundoscopy, revealed no abnormalities. This case suggests the possibility of isolated intracranial hypertension as a complication of repeated nusinersen therapy. Routine LOP monitoring is advised for long-term recipients to detect early complications.\u003c/p\u003e","manuscriptTitle":"Isolated intracranial hypertension developing in SMA receiving nusinersen: A case report","msid":"","msnumber":"","nonDraftVersions":[{"code":1,"date":"2025-06-04 04:27:32","doi":"10.21203/rs.3.rs-6757354/v1","editorialEvents":[{"type":"communityComments","content":0}],"status":"published","journal":{"display":true,"email":"info@researchsquare.com","identity":"researchsquare","isNatureJournal":false,"hasQc":true,"allowDirectSubmit":true,"externalIdentity":"","sideBox":"","snPcode":"","submissionUrl":"/submission","title":"Research Square","twitterHandle":"researchsquare","acdcEnabled":true,"dfaEnabled":false,"editorialSystem":"","reportingPortfolio":"","inReviewEnabled":false,"inReviewRevisionsEnabled":true}}],"origin":"","ownerIdentity":"dfc34671-8b2b-4378-a5e5-d46a04ceb60a","owner":[],"postedDate":"June 4th, 2025","published":true,"recentEditorialEvents":[],"rejectedJournal":[],"revision":"","amendment":"","status":"posted","subjectAreas":[],"tags":[],"updatedAt":"2025-07-03T17:38:23+00:00","versionOfRecord":[],"versionCreatedAt":"2025-06-04 04:27:32","video":"","vorDoi":"","vorDoiUrl":"","workflowStages":[]},"version":"v1","identity":"rs-6757354","journalConfig":"researchsquare"},"__N_SSP":true},"page":"/article/[identity]/[[...version]]","query":{"identity":"rs-6757354","version":["v1"]},"buildI
